<style>
/* Layout: kitchen pass — a tool bar, a scannable library list, and an editor with the financial summary pinned beside the sheet. */
:root{
  --bg:#edf0ef; --surface:#ffffff; --surface-2:#f5f7f6; --ink:#15201c; --muted:#596762; --line:#d3dbd8; --line-2:#e3e8e6;
  --accent:#1e43c0; --accent-ink:#ffffff; --accent-soft:#e3e9ff; --tape:#cfdcff; --tape-ink:#13286f;
  --good:#1d7548; --good-bg:#e1f2e8; --warn:#9a5c00; --warn-bg:#fbefd9; --bad:#ae2a1f; --bad-bg:#fbe3e0;
  --shadow:0 1px 2px rgba(20,32,28,.06),0 4px 14px rgba(20,32,28,.05);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101413; --surface:#181e1c; --surface-2:#1e2523; --ink:#e6ecea; --muted:#9aa8a3; --line:#2e3835; --line-2:#252e2b;
  --accent:#7f9cff; --accent-ink:#0b1430; --accent-soft:#1d2852; --tape:#2a3a78; --tape-ink:#dce4ff;
  --good:#6fd3a0; --good-bg:#16322a; --warn:#f1b65a; --warn-bg:#3a2c12; --bad:#ff8f84; --bad-bg:#3d1c19;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#101413; --surface:#181e1c; --surface-2:#1e2523; --ink:#e6ecea; --muted:#9aa8a3; --line:#2e3835; --line-2:#252e2b;
  --accent:#7f9cff; --accent-ink:#0b1430; --accent-soft:#1d2852; --tape:#2a3a78; --tape-ink:#dce4ff;
  --good:#6fd3a0; --good-bg:#16322a; --warn:#f1b65a; --warn-bg:#3a2c12; --bad:#ff8f84; --bad-bg:#3d1c19;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;cursor:pointer;background:none;border:0;padding:0}
.brand b{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em;text-transform:uppercase}
.brand span{color:var(--muted);font-size:13px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:6px;display:grid;min-width:240px;z-index:20}
.menu-pop button{text-align:left;background:none;border:0;padding:8px 10px;border-radius:5px;cursor:pointer}
.menu-pop button:hover{background:var(--surface-2)}
.menu-pop small{display:block;color:var(--muted);font-size:12px}

main{padding-block:22px 60px}
.notice{background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:10px 14px;margin-bottom:16px;font-size:14px}

/* library */
.lib-head{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
h1{font-family:var(--f-display);font-weight:700;font-size:38px;line-height:1;margin:0;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.stats{display:flex;gap:22px;flex-wrap:wrap}
.stat{display:grid}
.stat small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat b{font-family:var(--f-mono);font-weight:500;font-size:18px;font-variant-numeric:tabular-nums}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters input,.filters select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 10px;min-width:0}
.filters input{flex:1 1 220px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.row{display:grid;grid-template-columns:88px minmax(0,1fr) 150px 64px 92px 92px 96px 98px;gap:12px;align-items:center;padding:11px 16px;border-top:1px solid var(--line-2);cursor:pointer;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.row.head{cursor:default;background:var(--surface-2);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-block:8px}
.row .code{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.row .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .name small{display:block;font-weight:400;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.row .n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;font-size:14px}
.row .fam{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.none{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.st-validada{background:var(--good-bg);color:var(--good)}
.pill.st-teste{background:var(--accent-soft);color:var(--accent)}
.pill.st-rascunho{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.empty{padding:48px 24px;text-align:center;display:grid;gap:12px;justify-items:center}
.empty h2{font-family:var(--f-display);text-transform:uppercase;font-size:24px;margin:0}
.empty p{color:var(--muted);max-width:52ch;margin:0}
@media (max-width:860px){
  .row.head{display:none}
  .row{grid-template-columns:1fr auto;grid-template-areas:"code st" "name name" "meta fc";row-gap:4px}
  .row .code{grid-area:code}.row .name{grid-area:name;white-space:normal}.row .st{grid-area:st}.row .fcc{grid-area:fc}
  .row .fam,.row .dz,.row .cd,.row .pv{display:none}
  .row .meta{display:block!important;grid-area:meta;color:var(--muted);font-size:13px;font-family:var(--f-mono)}
}
.row .meta{display:none}

/* editor */
.ed-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.tape{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.06em;background:var(--tape);color:var(--tape-ink);padding:3px 14px 2px;transform:rotate(-1.5deg);box-shadow:0 1px 0 rgba(0,0,0,.08);clip-path:polygon(2% 0,98% 4%,100% 50%,97% 100%,1% 96%,0 48%)}
.savestate{font-size:13px;color:var(--muted);margin-right:auto}
.savestate.err{color:var(--bad)}
.ed-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
@media (max-width:980px){.ed-grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px 18px 20px}
.stack{display:grid;gap:16px;min-width:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 12px}
.sec-h h2{font-family:var(--f-display);font-weight:600;font-size:19px;text-transform:uppercase;letter-spacing:.04em;margin:0}
.sec-h small{color:var(--muted);font-size:12.5px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.fields .wide{grid-column:1/-1}
label.f{display:grid;gap:4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea,.cellin{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:8px 10px;font-size:15px;letter-spacing:0;text-transform:none;color:var(--ink);width:100%;min-width:0}
label.f input:focus,label.f select:focus,label.f textarea:focus,.cellin:focus{background:var(--surface);border-color:var(--accent);outline:none}
textarea{resize:vertical;line-height:1.55}
.name-in{font-family:var(--f-display)!important;font-size:24px!important;font-weight:600}
.tbl-wrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
table.ing{border-collapse:collapse;width:100%;min-width:760px}
table.ing th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;padding:0 6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.ing td{padding:5px 4px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.ing .cellin{padding:6px 8px;font-size:14px}
table.ing .num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
table.ing td.cost{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;padding-right:8px;white-space:nowrap}
table.ing tfoot td{border:0;padding-top:10px;font-weight:600}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:4px 8px;border-radius:4px}
.x:hover{color:var(--bad);background:var(--bad-bg)}
.hint{color:var(--muted);font-size:12.5px;margin:10px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;user-select:none;background:var(--surface)}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip:has(input:checked){background:var(--bad-bg);color:var(--bad);border-color:transparent;font-weight:600}
.chip:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}

/* summary */
.summary{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:grid;gap:14px}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sum h3{margin:0;padding:10px 16px;font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:16px;background:var(--ink);color:var(--bg)}
.sum dl{margin:0;display:grid;grid-template-columns:1fr auto;padding:6px 16px 12px}
.sum dt,.sum dd{padding:8px 0;border-bottom:1px dashed var(--line);margin:0;display:flex;align-items:center}
.sum dt{font-size:13.5px;color:var(--muted)}
.sum dd{justify-content:flex-end;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500}
.sum dt.big,.sum dd.big{font-size:16px;color:var(--ink);font-weight:600}
.sum dd input{width:86px;text-align:right;border:1px solid var(--line);background:var(--surface-2);border-radius:5px;padding:4px 6px;font-family:var(--f-mono);font-size:14px}
.sum .foot{padding:0 16px 14px;font-size:12px;color:var(--muted)}
.photo{display:grid;gap:10px}
.photo img{border-radius:6px;border:1px solid var(--line);aspect-ratio:4/3;object-fit:cover;width:100%;max-width:100%}

/* preview */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:28px;max-width:960px}
.sheet .title{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:3px solid var(--ink);padding-bottom:12px;margin-bottom:16px}
.sheet .title small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:block}
.sheet .title h1{font-size:34px}
.meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:20px}
.meta-grid div{background:var(--surface);padding:8px 12px;display:grid}
.meta-grid small{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.meta-grid b{font-weight:600}
.scale{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-soft);border-radius:6px;padding:10px 14px;margin-bottom:16px;font-size:14px}
.scale input{width:80px;border:1px solid var(--line);border-radius:5px;padding:5px 8px;background:var(--surface);font-family:var(--f-mono)}
.pv-cols{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:22px;align-items:start}
@media (max-width:820px){.pv-cols{grid-template-columns:1fr}.sheet{padding:18px}}
table.pv{border-collapse:collapse;width:100%;font-size:14px}
table.pv th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;border-bottom:1px solid var(--ink);padding:6px}
table.pv td{border-bottom:1px solid var(--line-2);padding:7px 6px}
table.pv .num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
table.pv tfoot td{font-weight:600;border-bottom:0}
.pv-sec{margin-top:22px}
.pv-sec h3{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.05em;font-size:17px;margin:0 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.pv-sec ol{margin:0;padding-left:22px;display:grid;gap:6px;max-width:70ch}
.pv-sec p{margin:0;white-space:pre-wrap;max-width:70ch}
.muted{color:var(--muted)}

/* language switch */
.lang{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.lang button{border:0;background:var(--surface);padding:6px 10px;font-size:13px;font-weight:600;letter-spacing:.04em;cursor:pointer;color:var(--muted)}
.lang button+button{border-left:1px solid var(--line)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* standalone page reset */
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.localnote{color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:6px;padding:8px 12px;margin-bottom:16px}

/* library details */
.libmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:8px;font-size:14px}
.libmeta span b{font-weight:600}
.libmeta span small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.libmeta .btn{padding:3px 10px;font-size:13px}
.kv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) auto;gap:6px;align-items:center}
.dlg label.f{gap:4px}
.dlg .kvlist{display:grid;gap:6px}

/* PDF selection */
.selbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--accent-soft);border-radius:8px;padding:10px 12px;margin-bottom:12px}
.selbar .grow{margin-right:auto;font-size:14px}
.selbar b{font-family:var(--f-mono);font-weight:500}
.row input[type=checkbox],.dlg input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);margin:0;flex:none}
.row .code{display:flex;align-items:center;gap:8px}
.row.picked{background:var(--accent-soft)}
.dlg .opts{display:grid;gap:10px}
.dlg .opts label{display:flex;gap:10px;align-items:center;font-size:14px;cursor:pointer}

/* dialog + toast */
.scrim{position:fixed;inset:0;background:rgba(10,15,13,.45);display:grid;place-items:center;z-index:50;padding:16px}
.dlg{background:var(--surface);border-radius:10px;padding:22px;max-width:420px;width:100%;box-shadow:var(--shadow);display:grid;gap:12px}
.dlg h2{margin:0;font-family:var(--f-display);text-transform:uppercase;font-size:22px}
.dlg p{margin:0;color:var(--muted)}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{transform:translate(-50%,8px);opacity:0}}}
</style>
</head>

/* ---------- languages ---------- */

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{if(v===""||v==null)return 0;const n=parseFloat(String(v).replace(/\s/g,"").replace(",","."));return isFinite(n)?n:0};
const eur=n=>(n||0).toLocaleString(loc(),{style:"currency",currency:"EUR"});
const QTY_FMT={minimumFractionDigits:3,maximumFractionDigits:4};

const fqIn=v=>{const raw=String(v??"").trim();if(raw===""||!isFinite(parseFloat(raw.replace(",","."))))return raw;return num(raw).toLocaleString(loc(),{...QTY_FMT,useGrouping:false})};
const pct=n=>n==null||!isFinite(n)?"—":(n).toLocaleString(loc(),{style:"percent",maximumFractionDigits:1});
const today=()=>new Date().toISOString().slice(0,10);
function lineCost(i){const y=num(i.yield)||100;return num(i.qty)*num(i.price)/(y/100)}
function calc(s){
  const total=(s.ingredients||[]).reduce((a,i)=>a+lineCost(i),0);
  const doses=num(s.doses), perDose=doses>0?total/doses:0, fc=num(s.targetFc)||30;
  const rec=perDose>0?perDose/(fc/100):0, sale=num(s.salePrice);
  return {total,doses,perDose,fc,rec,sale,margin:sale>0?sale-perDose:null,fcReal:sale>0?perDose/sale:null};
}
function fcPill(c){
  if(c.fcReal==null) return `<span class="pill none">${esc(t("noSale"))}</span>`;
  const cls=c.fcReal*100<=c.fc?"good":c.fcReal*100<=c.fc+5?"warn":"bad";
  return `<span class="pill ${cls}" title="${esc(t("fcTip",c.fc))}">${pct(c.fcReal)}</span>`;
}
const stPill=s=>`<span class="pill st-${esc(L().status[s]?s:"rascunho")}">${esc(stLabel(s))}</span>`;
function blankIng(){return {name:"",unit:"kg",qty:"",price:"",yield:""}}
function blank(code){return {name:"",code,family:"",doses:"",prepTime:"",cookTime:"",ingredients:[blankIng(),blankIng(),blankIng()],method:"",notes:"",conservation:"",allergens:[],status:"rascunho",source:"curso",sourceNote:"",tags:"",targetFc:30,salePrice:"",photoId:null,photoUrl:null,createdAt:Date.now(),updatedAt:Date.now()}}

function confirmBox(title,text,okLabel,danger){return new Promise(res=>{
  const d=document.createElement("div");d.className="scrim";
  d.innerHTML=`<div class="dlg" role="dialog" aria-modal="true"><h2>${esc(title)}</h2><p>${esc(text)}</p><div class="acts"><button class="btn" data-r="0" type="button">${esc(t("cancel"))}</button><button class="btn ${danger?"danger":"primary"}" data-r="1" type="button">${esc(okLabel)}</button></div></div>`;
  d.addEventListener("click",e=>{const r=e.target.closest("[data-r]");if(r||e.target===d){d.remove();res(r?.dataset.r==="1")}});
  layer.appendChild(d);d.querySelector('[data-r="1"]').focus();
})}
function catalog(){
  const m=new Map();
  const all=[...sheets.values()];if(current)all.push(current.data);
  for(const s of all)for(const i of s.ingredients||[]){const k=i.name.trim().toLowerCase();if(!k)continue;const p=m.get(k);if(!p||(s.updatedAt||0)>=p.t)m.set(k,{name:i.name.trim(),unit:i.unit,price:i.price,yield:i.yield,t:s.updatedAt||0})}
  return m;
}

    <div><div class="sec-h" style="margin:4px 0 6px"><h2 style="font-size:15px">${esc(t("extraFields"))}</h2></div><div class="kvlist">${rows()}</div>

  draw();

function renderSelBar(){

/* ---------- saving ---------- */
let saveTimer=null,saving=Promise.resolve(),dirty=false;
function setSave(state,msg){const el=document.getElementById("saveState");if(!el)return;el.classList.toggle("err",state==="error");el.textContent=msg||t({pending:"pending",saving:"saving",saved:"saved",waiting:"saveWaiting"}[state])}
function touch(){if(!current||!canWrite||!db)return;dirty=true;current.data.updatedAt=Date.now();setSave(current.isNew&&!current.data.name.trim()?"waiting":"pending");clearTimeout(saveTimer);saveTimer=setTimeout(flush,1200)}
function flush(){
  clearTimeout(saveTimer);
  if(!dirty||!current||!db||!canWrite)return saving;
  if(current.isNew&&!current.data.name.trim())return saving;
  dirty=false;const {id}=current,body=JSON.parse(JSON.stringify(current.data)),cur=current;
  setSave("saving");
  saving=saving.then(()=>db.collection("sheets").doc(id).set(body)).then(()=>{cur.isNew=false;sheets.set(id,body);if(current===cur&&!dirty){setSave("saved");document.getElementById("dup")?.removeAttribute("disabled");document.getElementById("del")?.removeAttribute("disabled")}})
  .catch(err=>{dirty=true;
    if(err?.code==="invalid_argument"){canWrite=false;setSave("error",t("errPerm"))}
    else if(err?.code==="quota_exceeded")setSave("error",t("errQuota"));
    else setSave("error",t("errNet"))});
  return saving;
}
async function leave(next){await flush();next()}
async function duplicate(){
  await flush();const s=JSON.parse(JSON.stringify(current.data));
  Object.assign(s,{name:s.name+t("copySuffix"),code:nextCode(),status:"rascunho",photoId:null,photoUrl:null,createdAt:Date.now(),updatedAt:Date.now()});
  current={id:db.collection("sheets").doc().id,data:s,isNew:true};dirty=true;await flush();renderEditor();toast(t("dupDone"));
}
async function removeSheet(){
  const s=current.data;
  if(!await confirmBox(t("delTitle"),t("delText",s.code,s.name||t("noName")),t("del"),true))return;
  clearTimeout(saveTimer);dirty=false;
  try{await db.collection("sheets").doc(current.id).delete();sheets.delete(current.id);if(s.photoId&&assets)assets.delete(s.photoId).catch(()=>{});toast(t("deleted"));renderLibrary()}
  catch(e){toast(t("delFail"))}
}

async function save(filename,data){

const safeName=s=>(s||"ficha").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"_").slice(0,60);
function exportXlsx(s){
  if(typeof XLSX==="undefined"){toast(t("xlsxFail"));return}
  const X=L().x,c=calc(s),ings=(s.ingredients||[]).filter(i=>i.name||num(i.qty));
  const useY=ings.some(i=>num(i.yield)&&num(i.yield)!==100);
  const ws={};const put=(a,v)=>{if(v==null||v==="")return;ws[a]=typeof v==="object"?v:(typeof v==="number"?{t:"n",v}:{t:"s",v:String(v)})};
  const N=(v,z)=>({t:"n",v,z:z||"0.00"});
  if(libLine())put("B1",libLine());
  put("B2",X.title);
  put("B3",X.name);put("C3",s.name);put("F3",X.code);put("G3",s.code);
  put("B4",X.fam);put("C4",s.family);put("F4",X.doses);put("G4",num(s.doses)||"");
  put("B5",X.prep);put("C5",s.prepTime);put("F5",X.cook);put("G5",s.cookTime);
  X.heads.forEach((h,k)=>put("BCDEF"[k]+"6",h));
  if(useY)put("G6",X.yield);
  put("H6",X.sum);put("I6",X.val);
  let r=7;
  for(const i of ings){
    put("B"+r,i.name);put("C"+r,i.unit);
    if(!isQb(i.unit)||num(i.qty))put("D"+r,N(num(i.qty),"0.000"));
    put("E"+r,N(num(i.price)));
    if(useY){put("G"+r,N(num(i.yield)||100,"0"));ws["F"+r]={t:"n",v:lineCost(i),f:`IF(G${r}>0,D${r}*E${r}/(G${r}/100),D${r}*E${r})`,z:"0.00"}}
    else ws["F"+r]={t:"n",v:lineCost(i),f:`D${r}*E${r}`,z:"0.00"};
    r++;
  }
  const last=Math.max(r-1,7);
  const vals=[{t:"n",v:c.total,f:`SUM(F7:F${last})`,z:"0.00"},{t:"n",v:c.doses,f:"G4"},{t:"n",v:c.perDose,f:"IF(I8>0,I7/I8,0)",z:"0.00"},
    {t:"n",v:c.fc/100,z:"0%"},{t:"n",v:c.rec,f:"IF(I10>0,I9/I10,0)",z:"0.00"},c.sale?N(c.sale):"",
    c.sale?{t:"n",v:c.margin,f:"I12-I9",z:"0.00"}:"",c.sale?{t:"n",v:c.fcReal,f:"IF(I12>0,I9/I12,0)",z:"0.0%"}:""];
  X.rows.forEach((l,k)=>{put("H"+(7+k),l);put("I"+(7+k),vals[k])});
  let y=Math.max(r,7+X.rows.length)+1;
  const block=(title,text)=>{put("B"+y,title);y++;for(const line of String(text||"").split(/\n/)){if(line.trim()){put("B"+y,line.trim());y++}}y++};
  block(X.method,(s.method||"").split(/\n+/).filter(x=>x.trim()).map((x,k)=>`${k+1}. ${x.trim()}`).join("\n"));
  block(X.notes,s.notes);
  block(X.all,(s.allergens||[]).map(allergenLabel).join(", ")||X.allNone);
  if(s.conservation)block(X.cons,s.conservation);
  block(X.origin,[srcLabel(s.source),s.sourceNote,X.status+": "+stLabel(s.status)].filter(Boolean).join(" — "));
  ws["!ref"]=`A1:I${y}`;
  ws["!cols"]=[{wch:3},{wch:34},{wch:14},{wch:12},{wch:16},{wch:14},{wch:10},{wch:20},{wch:12}];
  ws["!merges"]=[{s:{r:1,c:1},e:{r:1,c:6}}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,X.sheet);
  save(`${safeName(s.code)}_${safeName(s.name)}.xlsx`,XLSX.write(wb,{bookType:"xlsx",type:"array"}));
}
function exportCsv(){
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const dec=lang==="en"?".":",",sep=lang==="en"?",":";";
  const n=v=>v==null?"":v.toFixed(2).replace(".",dec);
  const rows=[...sheets.values()].sort((a,b)=>String(a.code).localeCompare(String(b.code),loc(),{numeric:true})).map(s=>{const c=calc(s);return [s.code,s.name,s.family,stLabel(s.status),s.doses,n(c.total),n(c.perDose),n(c.rec),c.sale?n(c.sale):"",n(c.margin),c.fcReal==null?"":(c.fcReal*100).toFixed(1).replace(".",dec),(s.allergens||[]).map(allergenLabel).join(", "),srcLabel(s.source),new Date(s.updatedAt||0).toLocaleDateString(loc())].map(q).join(sep)});
  save(`${L().x.file}_${today()}.csv`,"﻿"+[L().csvHead.map(q).join(sep),...rows].join("\r\n"));
}
function exportJson(){save(`${L().x.file}_${today()}.json`,JSON.stringify({format:"fichas-tecnicas",version:1,exportedAt:new Date().toISOString(),settings:{library:{owner:libInfo.owner||"",fields:libFields()}},sheets:Object.fromEntries(sheets)},null,2))}
async function importJson(file){
  if(!db||!canWrite){toast(t("impNo"));return}
  let data;try{data=JSON.parse(await file.text())}catch{toast(t("notJson"));return}
  const src=data?.sheets&&typeof data.sheets==="object"?data.sheets:null;
  if(!src){toast(t("notBackup"));return}
  const entries=Object.entries(src);
  if(!await confirmBox(t("impTitle"),t("impText",entries.length),t("impOk")))return;
  let ok=0;
  for(const [id,s] of entries){
    if(!s||typeof s!=="object")continue;
    const safeId=/^[\w\-.~:@+]{1,120}$/.test(id)?id:db.collection("sheets").doc().id;
    const body={...blank(s.code||nextCode()),...s,photoId:null,photoUrl:s.photoUrl&&(String(s.photoUrl).startsWith("/_blob/")||String(s.photoUrl).startsWith("data:image/"))?s.photoUrl:null};
    body.allergens=(body.allergens||[]).map(allergenKey);
    try{await db.collection("sheets").doc(safeId).set(body);ok++}catch(e){if(e?.code==="quota_exceeded"){toast(t("impFull"));break}}
  }
  const li=data?.settings?.library;
  if(li&&typeof li==="object"&&(li.owner||(li.fields||[]).length)){try{const next={owner:String(li.owner||""),fields:(Array.isArray(li.fields)?li.fields:[]).map(f=>({label:String(f?.label||""),value:String(f?.value||"")})),updatedAt:Date.now()};await db.collection("settings").doc("library").set(next);libInfo=next;renderLibMeta()}catch(e){}}
  toast(t("impDone",ok));
}

/* ---------- PDF ---------- */
const PDF_MAP={"≥":">=","≤":"<=","→":"->","←":"<-","≈":"~","−":"-","✓":"v"};
const WINANSI_EXTRA="€‚ƒ„…†‡ˆ‰Š‹ŒŽ‘’“”•–—˜™š›œžŸ";
const pdfTxt=v=>String(v??"").replace(/[    ]/g," ").replace(/[\ud800-\udbff][\udc00-\udfff]/g,"").replace(/[\s\S]/g,ch=>{if(PDF_MAP[ch])return PDF_MAP[ch];return ch.charCodeAt(0)<256||WINANSI_EXTRA.includes(ch)?ch:"?"});
function pdfOptions(n){return new Promise(res=>{
  const d=document.createElement("div");d.className="scrim";
  d.innerHTML=`<div class="dlg" role="dialog" aria-modal="true"><h2>${esc(t("pdfOptTitle"))}</h2><p>${esc(t("pdfOptText",n))}</p>
    <div class="opts">${n>1?`<label><input type="checkbox" id="po-cover" checked>${esc(t("optCover"))}</label>`:""}
    <label><input type="checkbox" id="po-costs" checked>${esc(t("optCosts"))}</label>
    <label><input type="checkbox" id="po-photos" checked>${esc(t("optPhotos"))}</label></div>
    <div class="acts"><button class="btn" data-r="0" type="button">${esc(t("cancel"))}</button><button class="btn primary" data-r="1" type="button">${esc(t("pdfMake"))}</button></div></div>`;
  d.addEventListener("click",e=>{const r=e.target.closest("[data-r]");if(!r&&e.target!==d)return;
    const o=r?.dataset.r==="1"?{cover:!!d.querySelector("#po-cover")?.checked,costs:d.querySelector("#po-costs").checked,photos:d.querySelector("#po-photos").checked}:null;d.remove();res(o)});
  layer.appendChild(d);d.querySelector('[data-r="1"]').focus();
})}
async function pdfFor(ids){
  const items=ids.map(id=>({id,s:sheets.get(id)})).filter(x=>x.s).sort((a,b)=>String(a.s.code).localeCompare(String(b.s.code),loc(),{numeric:true}));
  if(!items.length){toast(t("pdfNone"));return}
  const o=await pdfOptions(items.length);if(o)await makePdf(items,o);
}
function loadImg(url){return new Promise(res=>{const im=new Image();im.onload=()=>{try{const sc=Math.min(1,1400/Math.max(im.naturalWidth,im.naturalHeight));const cv=document.createElement("canvas");cv.width=Math.max(1,Math.round(im.naturalWidth*sc));cv.height=Math.max(1,Math.round(im.naturalHeight*sc));const cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(im,0,0,cv.width,cv.height);res({data:cv.toDataURL("image/jpeg",.85),w:cv.width,h:cv.height})}catch{res(null)}};im.onerror=()=>res(null);im.src=url})}
async function makePdf(items,opts){
  const J=window.jspdf&&window.jspdf.jsPDF;if(!J){toast(t("pdfLibFail"));return}
  if(!items.length){toast(t("pdfNone"));return}
  toast(t("pdfMaking"));
  let doc;
  try{
    const photos=new Map();
    if(opts.photos)for(const {id,s} of items)if(s.photoUrl){const im=await loadImg(s.photoUrl);if(im)photos.set(id,im)}
    doc=new J({unit:"mm",format:"a4",compress:true});
    const W=210,H=297,M=15,CW=W-2*M,BOT=H-18;
    const INK=[21,32,28],MUT=[89,103,98],LINE=[211,219,216],ACC=[30,67,192],TAPE=[207,220,255],TAPEI=[19,40,111],SOFT=[243,245,244],RED=[174,42,31];
    const X=L().x;let y=M;
    const F=(sz,st="normal",col=INK)=>{doc.setFont("helvetica",st);doc.setFontSize(sz);doc.setTextColor(...col)};
    const lh=sz=>sz*0.3528*1.3;
    const newPage=()=>{doc.addPage();y=M+2};
    const ensure=h=>{if(y+h>BOT)newPage()};
    const multi=items.length>1&&opts.cover,FIRST=30,PER=44;
    const idxPages=multi?1+Math.max(0,Math.ceil((items.length-FIRST)/PER)):0;
    for(let i=1;i<idxPages;i++)doc.addPage();
    const heading=txt=>{ensure(16);y+=4;F(10.5,"bold",INK);doc.text(pdfTxt(txt.toUpperCase()),M,y);y+=1.8;doc.setDrawColor(...ACC);doc.setLineWidth(.5);doc.line(M,y,M+CW,y);y+=5.2};
    const para=(txt,sz=10,col=INK,indent=0,prefix="")=>{F(sz,"normal",col);const lines=doc.splitTextToSize(pdfTxt(txt),CW-indent);
      lines.forEach((ln,i)=>{ensure(lh(sz));if(i===0&&prefix){F(sz,"bold",ACC);doc.text(prefix,M,y);F(sz,"normal",col)}doc.text(ln,M+indent,y);y+=lh(sz)})};
    const drawSheet=(s,photo)=>{
      const c=calc(s);
      F(13,"bold",TAPEI);const code=pdfTxt(s.code||"");const cw=Math.max(20,doc.getTextWidth(code)+9);
      doc.setFillColor(...TAPE);doc.rect(W-M-cw,y-1.5,cw,8.5,"F");doc.text(code,W-M-cw/2,y+4.5,{align:"center"});
      F(7.5,"bold",MUT);doc.text(pdfTxt(X.title),M,y+2.5);y+=5;
      F(18,"bold",INK);doc.splitTextToSize(pdfTxt(s.name||t("noName")),CW-cw-4).forEach(l=>{y+=7.2;doc.text(l,M,y)});
      y+=3.5;doc.setDrawColor(...INK);doc.setLineWidth(.7);doc.line(M,y,M+CW,y);y+=3;
      const meta=[[t("fFam"),s.family],[t("fDoses"),s.doses],[t("fPrep"),s.prepTime],[t("fCook"),s.cookTime],[t("fSt"),stLabel(s.status)],[t("origin"),[srcLabel(s.source),s.sourceNote].filter(Boolean).join(" — ")]];
      const cwd=CW/3;
      for(let r=0;r<2;r++){
        F(9.5,"bold");const cells=meta.slice(r*3,r*3+3).map(([l,v])=>[l,doc.splitTextToSize(pdfTxt(v||"—"),cwd-5)]);
        const rh=Math.max(...cells.map(([,v])=>v.length))*3.9+8;
        doc.setLineWidth(.2);doc.setDrawColor(...LINE);
        cells.forEach(([l,v],i)=>{const x=M+i*cwd;doc.rect(x,y,cwd,rh);F(6.8,"normal",MUT);doc.text(pdfTxt(l.toUpperCase()),x+2.5,y+4);F(9.5,"bold",INK);doc.text(v,x+2.5,y+8.6)});
        y+=rh;
      }
      y+=6;
      const cols=opts.costs?[[t("thIng"),76,"left"],[t("unitShort"),18,"left"],[t("thQty"),24,"right"],[t("priceShort"),31,"right"],[t("costShort"),31,"right"]]:[[t("thIng"),118,"left"],[t("unitShort"),27,"left"],[t("thQty"),35,"right"]];
      const head=()=>{doc.setFillColor(...SOFT);doc.rect(M,y,CW,7,"F");F(7,"bold",MUT);let x=M;cols.forEach(([h,w,a])=>{doc.text(pdfTxt(h.toUpperCase()),a==="right"?x+w-2:x+2,y+4.7,{align:a});x+=w});y+=7};
      ensure(18);head();
      const ings=(s.ingredients||[]).filter(i=>i.name||num(i.qty));
      if(!ings.length){F(9.5,"normal",MUT);doc.text(pdfTxt(t("noIng")),M+2,y+5);y+=8}
      for(const i of ings){
        F(9.5);const nm=i.name+(num(i.yield)&&num(i.yield)!==100?` (${t("aprov")} ${i.yield} %)`:"");
        const nl=doc.splitTextToSize(pdfTxt(nm),cols[0][1]-4);const rh=nl.length*3.9+3.4;
        if(y+rh>BOT){newPage();head()}
        const noPrice=String(i.price??"").trim()==="";
        const vals=[nl,pdfTxt(i.unit),isQb(i.unit)&&!num(i.qty)?"":pdfTxt(fq(num(i.qty))),noPrice?"":pdfTxt(eur(num(i.price))),noPrice?"":pdfTxt(eur(lineCost(i)))];
        let x=M;F(9.5,"normal",INK);cols.forEach(([,w,a],k)=>{doc.text(vals[k],a==="right"?x+w-2:x+2,y+4.6,{align:a});x+=w});
        y+=rh;doc.setDrawColor(...LINE);doc.setLineWidth(.2);doc.line(M,y,M+CW,y);
      }
      if(opts.costs){
        ensure(8);F(9.5,"bold",INK);doc.text(pdfTxt(t("totalCost")),M+CW-33,y+5,{align:"right"});doc.text(pdfTxt(eur(c.total)),M+CW-2,y+5,{align:"right"});y+=10;
        const pairs=[[t("sTotal"),eur(c.total)],[t("sDoses"),String(c.doses||"—")],[t("sDose"),eur(c.perDose)],[t("sRec"),c.rec?eur(c.rec):"—"],
          [t("sSale"),c.sale?eur(c.sale):"—"],[t("sMargin"),c.margin==null?"—":eur(c.margin)],[t("sFcReal"),c.fcReal==null?"—":pct(c.fcReal)],[t("sFc"),c.fc+" %"]];
        const bh=7+4*6.4+2;ensure(bh+2);
        doc.setFillColor(...INK);doc.rect(M,y,CW,7,"F");F(8.5,"bold",[255,255,255]);doc.text(pdfTxt(t("sumTitle").toUpperCase()),M+3,y+4.8);
        doc.setDrawColor(...LINE);doc.setLineWidth(.2);doc.rect(M,y,CW,bh);const half=CW/2;doc.line(M+half,y+7,M+half,y+bh);
        pairs.forEach(([l,v],k)=>{const x=M+(k<4?0:half),yy=y+7+(k%4)*6.4+4.6,big=k===2||k===4;
          F(9,big?"bold":"normal",big?INK:MUT);doc.text(pdfTxt(l),x+3,yy);F(9.5,big?"bold":"normal",INK);doc.text(pdfTxt(v),x+half-3,yy,{align:"right"})});
        y+=bh+2;
      }
      heading(t("secMethod"));
      const steps=(s.method||"").split(/\n+/).map(x=>x.trim()).filter(Boolean);
      if(steps.length)steps.forEach((st,k)=>{para(st,10,INK,7,(k+1)+".");y+=1});else para(t("toFill"),10,MUT);
      heading(t("secNotes"));
      if(photo){let w=80,h=w*photo.h/photo.w;if(h>62){h=62;w=h*photo.w/photo.h}ensure(h+4);doc.addImage(photo.data,"JPEG",M,y-2.5,w,h);y+=h+3}
      para(s.notes||t("toFill"),10,s.notes?INK:MUT);
      heading(t("secAll"));
      const al=(s.allergens||[]).map(allergenLabel);
      if(al.length){F(10,"bold",RED);doc.splitTextToSize(pdfTxt(al.join("  ·  ")),CW).forEach(l=>{ensure(lh(10));doc.text(l,M,y);y+=lh(10)})}else para(t("noAll"),10,MUT);
      if(s.conservation){heading(t("secCons"));para(s.conservation)}
    };
    const starts=[];
    items.forEach(({id,s},k)=>{if(multi||k>0)newPage();else y=M+2;starts.push(doc.getNumberOfPages());drawSheet(s,photos.get(id))});
    if(multi){
      doc.setPage(1);
      doc.setFillColor(...ACC);doc.rect(0,0,W,6,"F");
      F(30,"bold",INK);doc.text(pdfTxt(t("pdfDocTitle").toUpperCase()),M,42);
      F(11,"normal",MUT);doc.text(pdfTxt(t("pdfCoverSub",items.length,new Date().toLocaleDateString(loc(),{dateStyle:"long"}))),M,51);
      {let yy0=26;const own=String(libInfo.owner||"").trim();const fs=libFields();
       if(own||fs.length){F(10,"normal",MUT);const parts=[];if(own)parts.push(t("owner")+": "+own);fs.forEach(f=>parts.push((f.label?f.label+": ":"")+f.value));
         doc.splitTextToSize(pdfTxt(parts.join("   ·   ")),CW).slice(0,2).forEach((l,i)=>doc.text(l,M,yy0-4+i*4.6))}}
      doc.setDrawColor(...INK);doc.setLineWidth(.7);doc.line(M,58,M+CW,58);
      F(12,"bold",INK);doc.text(pdfTxt(t("pdfIndex").toUpperCase()),M,70);
      let p=1,yy=79;
      const hdr=()=>{F(7,"bold",MUT);doc.text(pdfTxt(t("colNo").toUpperCase()),M,yy);doc.text(pdfTxt(t("colDish").toUpperCase()),M+24,yy);doc.text(pdfTxt(t("colFam").toUpperCase()),M+120,yy);doc.text(pdfTxt(t("pdfPageCol").toUpperCase()),M+CW,yy,{align:"right"});yy+=5.5};
      hdr();
      items.forEach(({s},k)=>{
        if(k===FIRST+(p-1)*PER){p++;doc.setPage(p);yy=M+6;hdr()}
        F(9,"normal",MUT);doc.text(pdfTxt(s.code),M,yy);
        F(9.5,"normal",INK);doc.text(doc.splitTextToSize(pdfTxt(s.name||t("noName")),92)[0],M+24,yy);
        F(9,"normal",MUT);doc.text(doc.splitTextToSize(pdfTxt(s.family||"—"),40)[0],M+120,yy);
        F(9.5,"bold",INK);doc.text(String(starts[k]),M+CW,yy,{align:"right"});
        doc.setDrawColor(...LINE);doc.setLineWidth(.15);doc.line(M,yy+2,M+CW,yy+2);
        yy+=5.6;
      });
    }
    const n=doc.getNumberOfPages();
    for(let i=1;i<=n;i++){doc.setPage(i);F(7.5,"normal",MUT);doc.setDrawColor(...LINE);doc.setLineWidth(.2);doc.line(M,H-12,M+CW,H-12);doc.text(doc.splitTextToSize(pdfTxt([t("pdfDocTitle"),libLine()].filter(Boolean).join("  ·  ")),CW-40)[0],M,H-8);doc.text(pdfTxt(t("pdfPage",i,n)),M+CW,H-8,{align:"right"})}
  }catch(e){console.error(e);toast(t("pdfFail"));return}
  const one=items.length===1?items[0].s:null;
  await save(one?`${safeName(one.code)}_${safeName(one.name)}.pdf`:`${L().x.file}_${today()}.pdf`,doc.output("arraybuffer"));
}
