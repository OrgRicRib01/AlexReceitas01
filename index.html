<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Biblioteca de fichas técnicas de cozinha: custos, escalonamento, alergénios e exportação para Excel e PDF.">
<meta name="theme-color" content="#1e43c0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231e43c0'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='700' font-size='15' text-anchor='middle' fill='white'%3EFT%3C/text%3E%3C/svg%3E">
<title>Biblioteca de Fichas Técnicas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: kitchen pass — a tool bar, a scannable library list, and an editor with the financial summary pinned beside the sheet. */
:root{
  --bg:#edf0ef; --surface:#ffffff; --surface-2:#f5f7f6; --ink:#15201c; --muted:#596762; --line:#d3dbd8; --line-2:#e3e8e6;
  --accent:#1e43c0; --accent-ink:#ffffff; --accent-soft:#e3e9ff; --tape:#cfdcff; --tape-ink:#13286f;
  --good:#1d7548; --good-bg:#e1f2e8; --warn:#9a5c00; --warn-bg:#fbefd9; --bad:#ae2a1f; --bad-bg:#fbe3e0;
  --shadow:0 1px 2px rgba(20,32,28,.06),0 4px 14px rgba(20,32,28,.05);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101413; --surface:#181e1c; --surface-2:#1e2523; --ink:#e6ecea; --muted:#9aa8a3; --line:#2e3835; --line-2:#252e2b;
  --accent:#7f9cff; --accent-ink:#0b1430; --accent-soft:#1d2852; --tape:#2a3a78; --tape-ink:#dce4ff;
  --good:#6fd3a0; --good-bg:#16322a; --warn:#f1b65a; --warn-bg:#3a2c12; --bad:#ff8f84; --bad-bg:#3d1c19;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#101413; --surface:#181e1c; --surface-2:#1e2523; --ink:#e6ecea; --muted:#9aa8a3; --line:#2e3835; --line-2:#252e2b;
  --accent:#7f9cff; --accent-ink:#0b1430; --accent-soft:#1d2852; --tape:#2a3a78; --tape-ink:#dce4ff;
  --good:#6fd3a0; --good-bg:#16322a; --warn:#f1b65a; --warn-bg:#3a2c12; --bad:#ff8f84; --bad-bg:#3d1c19;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;cursor:pointer;background:none;border:0;padding:0}
.brand b{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em;text-transform:uppercase}
.brand span{color:var(--muted);font-size:13px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:6px;display:grid;min-width:240px;z-index:20}
.menu-pop button{text-align:left;background:none;border:0;padding:8px 10px;border-radius:5px;cursor:pointer}
.menu-pop button:hover{background:var(--surface-2)}
.menu-pop small{display:block;color:var(--muted);font-size:12px}

main{padding-block:22px 60px}
.notice{background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:10px 14px;margin-bottom:16px;font-size:14px}

/* library */
.lib-head{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
h1{font-family:var(--f-display);font-weight:700;font-size:38px;line-height:1;margin:0;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.stats{display:flex;gap:22px;flex-wrap:wrap}
.stat{display:grid}
.stat small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat b{font-family:var(--f-mono);font-weight:500;font-size:18px;font-variant-numeric:tabular-nums}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters input,.filters select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 10px;min-width:0}
.filters input{flex:1 1 220px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.row{display:grid;grid-template-columns:88px minmax(0,1fr) 150px 64px 92px 92px 96px 98px;gap:12px;align-items:center;padding:11px 16px;border-top:1px solid var(--line-2);cursor:pointer;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.row.head{cursor:default;background:var(--surface-2);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-block:8px}
.row .code{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.row .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .name small{display:block;font-weight:400;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.row .n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;font-size:14px}
.row .fam{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.none{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.st-validada{background:var(--good-bg);color:var(--good)}
.pill.st-teste{background:var(--accent-soft);color:var(--accent)}
.pill.st-rascunho{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.empty{padding:48px 24px;text-align:center;display:grid;gap:12px;justify-items:center}
.empty h2{font-family:var(--f-display);text-transform:uppercase;font-size:24px;margin:0}
.empty p{color:var(--muted);max-width:52ch;margin:0}
@media (max-width:860px){
  .row.head{display:none}
  .row{grid-template-columns:1fr auto;grid-template-areas:"code st" "name name" "meta fc";row-gap:4px}
  .row .code{grid-area:code}.row .name{grid-area:name;white-space:normal}.row .st{grid-area:st}.row .fcc{grid-area:fc}
  .row .fam,.row .dz,.row .cd,.row .pv{display:none}
  .row .meta{display:block!important;grid-area:meta;color:var(--muted);font-size:13px;font-family:var(--f-mono)}
}
.row .meta{display:none}

/* editor */
.ed-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.tape{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.06em;background:var(--tape);color:var(--tape-ink);padding:3px 14px 2px;transform:rotate(-1.5deg);box-shadow:0 1px 0 rgba(0,0,0,.08);clip-path:polygon(2% 0,98% 4%,100% 50%,97% 100%,1% 96%,0 48%)}
.savestate{font-size:13px;color:var(--muted);margin-right:auto}
.savestate.err{color:var(--bad)}
.ed-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
@media (max-width:980px){.ed-grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px 18px 20px}
.stack{display:grid;gap:16px;min-width:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 12px}
.sec-h h2{font-family:var(--f-display);font-weight:600;font-size:19px;text-transform:uppercase;letter-spacing:.04em;margin:0}
.sec-h small{color:var(--muted);font-size:12.5px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.fields .wide{grid-column:1/-1}
label.f{display:grid;gap:4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea,.cellin{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:8px 10px;font-size:15px;letter-spacing:0;text-transform:none;color:var(--ink);width:100%;min-width:0}
label.f input:focus,label.f select:focus,label.f textarea:focus,.cellin:focus{background:var(--surface);border-color:var(--accent);outline:none}
textarea{resize:vertical;line-height:1.55}
.name-in{font-family:var(--f-display)!important;font-size:24px!important;font-weight:600}
.tbl-wrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
table.ing{border-collapse:collapse;width:100%;min-width:760px}
table.ing th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;padding:0 6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.ing td{padding:5px 4px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.ing .cellin{padding:6px 8px;font-size:14px}
table.ing .num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
table.ing td.cost{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;padding-right:8px;white-space:nowrap}
table.ing tfoot td{border:0;padding-top:10px;font-weight:600}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:4px 8px;border-radius:4px}
.x:hover{color:var(--bad);background:var(--bad-bg)}
.hint{color:var(--muted);font-size:12.5px;margin:10px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;user-select:none;background:var(--surface)}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip:has(input:checked){background:var(--bad-bg);color:var(--bad);border-color:transparent;font-weight:600}
.chip:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}

/* summary */
.summary{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:grid;gap:14px}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sum h3{margin:0;padding:10px 16px;font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:16px;background:var(--ink);color:var(--bg)}
.sum dl{margin:0;display:grid;grid-template-columns:1fr auto;padding:6px 16px 12px}
.sum dt,.sum dd{padding:8px 0;border-bottom:1px dashed var(--line);margin:0;display:flex;align-items:center}
.sum dt{font-size:13.5px;color:var(--muted)}
.sum dd{justify-content:flex-end;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500}
.sum dt.big,.sum dd.big{font-size:16px;color:var(--ink);font-weight:600}
.sum dd input{width:86px;text-align:right;border:1px solid var(--line);background:var(--surface-2);border-radius:5px;padding:4px 6px;font-family:var(--f-mono);font-size:14px}
.sum .foot{padding:0 16px 14px;font-size:12px;color:var(--muted)}
.photo{display:grid;gap:10px}
.photo img{border-radius:6px;border:1px solid var(--line);aspect-ratio:4/3;object-fit:cover;width:100%;max-width:100%}

/* preview */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:28px;max-width:960px}
.sheet .title{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:3px solid var(--ink);padding-bottom:12px;margin-bottom:16px}
.sheet .title small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:block}
.sheet .title h1{font-size:34px}
.meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:20px}
.meta-grid div{background:var(--surface);padding:8px 12px;display:grid}
.meta-grid small{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.meta-grid b{font-weight:600}
.scale{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-soft);border-radius:6px;padding:10px 14px;margin-bottom:16px;font-size:14px}
.scale input{width:80px;border:1px solid var(--line);border-radius:5px;padding:5px 8px;background:var(--surface);font-family:var(--f-mono)}
.pv-cols{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:22px;align-items:start}
@media (max-width:820px){.pv-cols{grid-template-columns:1fr}.sheet{padding:18px}}
table.pv{border-collapse:collapse;width:100%;font-size:14px}
table.pv th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;border-bottom:1px solid var(--ink);padding:6px}
table.pv td{border-bottom:1px solid var(--line-2);padding:7px 6px}
table.pv .num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
table.pv tfoot td{font-weight:600;border-bottom:0}
.pv-sec{margin-top:22px}
.pv-sec h3{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.05em;font-size:17px;margin:0 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.pv-sec ol{margin:0;padding-left:22px;display:grid;gap:6px;max-width:70ch}
.pv-sec p{margin:0;white-space:pre-wrap;max-width:70ch}
.muted{color:var(--muted)}

/* language switch */
.lang{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.lang button{border:0;background:var(--surface);padding:6px 10px;font-size:13px;font-weight:600;letter-spacing:.04em;cursor:pointer;color:var(--muted)}
.lang button+button{border-left:1px solid var(--line)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* standalone page reset */
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.localnote{color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:6px;padding:8px 12px;margin-bottom:16px}

/* library details */
.libmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:8px;font-size:14px}
.libmeta span b{font-weight:600}
.libmeta span small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.libmeta .btn{padding:3px 10px;font-size:13px}
.kv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) auto;gap:6px;align-items:center}
.dlg label.f{gap:4px}
.dlg .kvlist{display:grid;gap:6px}

/* view tabs + ingredients */
.tabs{display:inline-flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:2px}
.tabs button{border:0;background:transparent;padding:6px 12px;border-radius:5px;font-size:14px;font-weight:500;cursor:pointer;color:var(--muted)}
.tabs button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.irow{display:grid;grid-template-columns:minmax(0,1.6fr) 150px 64px 128px 92px 140px 60px 96px;gap:12px;align-items:center;padding:10px 16px;border-top:1px solid var(--line-2);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;cursor:pointer}
.irow:first-child{border-top:0}
.irow:hover,.irow[aria-expanded="true"]{background:var(--surface-2)}
.irow.head{cursor:default;background:var(--surface-2);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-block:8px}
.irow .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.irow .n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;font-size:14px;white-space:nowrap}
.irow .mut{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.irow .est small{display:block;font-family:var(--f-body);font-size:11px;color:var(--accent)}
.trend-up{color:var(--bad)}.trend-down{color:var(--good)}
.irow .mob{display:none}
.ipanel{border-top:1px solid var(--line-2);background:var(--surface-2);padding:16px;display:grid;gap:14px}
.ipanel .acts{display:flex;gap:8px;flex-wrap:wrap}
.ipanel table{border-collapse:collapse;width:100%;font-size:13.5px}
.ipanel th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;border-bottom:1px solid var(--line);padding:5px 6px}
.ipanel td{border-bottom:1px solid var(--line-2);padding:6px}
.ipanel .num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.ipanel a.sheetlink{color:var(--accent);cursor:pointer;text-decoration:underline;background:none;border:0;padding:0;font:inherit}
@media (max-width:860px){
  .irow.head{display:none}
  .irow{grid-template-columns:minmax(0,1fr) auto;row-gap:2px}
  .irow .cat,.irow .un,.irow .avg,.irow .rng,.irow .us,.irow .upd{display:none}
  .irow .mob{display:block;grid-column:1/-1;color:var(--muted);font-size:12.5px}
}

/* dictation */
.dict-btn{gap:7px}
.dict-btn svg{width:15px;height:15px;flex:none}
.dict-btn[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.dictlive{display:flex;align-items:flex-start;gap:10px;margin-top:8px;padding:9px 12px;border-radius:6px;background:var(--bad-bg);color:var(--ink);font-size:14px}
.dictlive .dot{width:10px;height:10px;border-radius:50%;background:var(--bad);margin-top:5px;flex:none}
@media (prefers-reduced-motion:no-preference){.dictlive .dot{animation:pulse 1.2s ease-in-out infinite}@keyframes pulse{50%{opacity:.25}}}
.dictlive i{color:var(--muted)}

/* preparation photo gallery */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.pcard{display:grid;gap:6px;min-width:0}
.pcard .ph{position:relative;aspect-ratio:4/3;max-width:100%;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2)}
.pcard .ph img{width:100%;height:100%;object-fit:cover;display:block}
.pcard .ph .no{position:absolute;left:6px;top:6px;background:var(--ink);color:var(--bg);font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:4px}
.pcard .cellin{font-size:13.5px;padding:6px 8px}
.pcard .tools{display:flex;gap:4px;justify-content:flex-end}
.pcard .tools .x{font-size:15px}
.pv-gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.pv-gal figure{margin:0;display:grid;gap:5px;min-width:0}
.pv-gal button{padding:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;cursor:zoom-in;background:none;aspect-ratio:4/3;max-width:100%}
.pv-gal img{width:100%;height:100%;object-fit:cover;display:block}
.pv-gal figcaption{font-size:13.5px}
.pv-gal figcaption b{font-family:var(--f-mono);font-weight:500;color:var(--muted);margin-right:6px}
.lightbox{position:fixed;inset:0;z-index:70;background:rgba(8,12,11,.88);display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lightbox figure{margin:0;display:grid;gap:10px;justify-items:center;max-width:100%}
.lightbox img{max-width:min(1100px,100%);max-height:78vh;border-radius:6px;object-fit:contain}
.lightbox figcaption{color:#fff;font-size:15px;text-align:center}
.lightbox .btn{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px))}

/* PDF photo choice + featured plating photo on screen */
.dlg .phgroup{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.dlg .phgroup h3{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.dlg .phpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;max-height:230px;overflow:auto;padding:2px}
.dlg .phpick label{position:relative;display:block;cursor:pointer;border-radius:6px;overflow:hidden;border:2px solid transparent;aspect-ratio:4/3;max-width:100%}
.dlg .phpick label:has(input:checked){border-color:var(--accent)}
.dlg .phpick label:has(input:not(:checked)) img{opacity:.35}
.dlg .phpick img{width:100%;height:100%;object-fit:cover;display:block}
.dlg .phpick input{position:absolute;left:5px;top:5px}
.dlg .phpick span{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dlg .phbar{display:flex;gap:6px;align-items:center}
.dlg .phbar small{color:var(--muted);margin-right:auto}
.dlg .phbar .btn{padding:3px 9px;font-size:12.5px}
.dlg{max-height:calc(100vh - 32px);overflow:auto}
.pv-head{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start;margin-bottom:4px}
.pv-head.has-photo{grid-template-columns:minmax(0,1fr) minmax(200px,300px)}
.pv-plate{margin:0;display:grid;gap:6px}
.pv-plate button{padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:zoom-in;background:none;aspect-ratio:4/3;max-width:100%}
.pv-plate img{width:100%;height:100%;object-fit:cover;display:block}
.pv-plate figcaption{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:right}
@media (max-width:700px){.pv-head.has-photo{grid-template-columns:minmax(0,1fr)}.pv-plate{order:-1}}

/* library summary panel */
#stats{display:grid;grid-template-columns:repeat(3,auto);gap:12px 28px;align-items:start;justify-content:end;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px;min-width:0}
#stats .stat-chart{grid-column:1/-1;display:grid;gap:7px;min-width:min(300px,100%)}
#stats .stat-cap{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
#stats .stat-cap small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#stats .stat-cap span{font-size:12px;color:var(--accent);font-weight:600}
.stbar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--line-2);gap:2px}
.stbar span{display:block;height:100%;min-width:4px}
.seg-rascunho{background:var(--muted)}.seg-teste{background:var(--accent)}.seg-validada{background:var(--good)}
.stleg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.stleg span{display:inline-flex;align-items:center;gap:5px}
.stleg i{display:inline-block;width:9px;height:9px;border-radius:50%}
.stleg b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
#stats .stat .sub{font-size:11.5px;color:var(--muted)}
@media (max-width:860px){#stats{justify-content:stretch;grid-template-columns:repeat(3,minmax(0,1fr));width:100%}}

/* sync status */
.sync{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync[data-st="ok"] i{background:var(--good)}
.sync[data-st="busy"] i,.sync[data-st="pending"] i{background:var(--warn)}
.sync[data-st="error"] i,.sync[data-st="offline"] i{background:var(--bad)}
.sync[data-st="ro"] i{background:var(--accent)}
@media (prefers-reduced-motion:no-preference){.sync[data-st="busy"] i{animation:pulse 1s ease-in-out infinite}}
.notice .btn{margin-left:8px;padding:3px 10px;font-size:13px}
.dlg code{font-family:var(--f-mono);font-size:12.5px;background:var(--surface-2);padding:1px 5px;border-radius:4px}
.syncmsg{font-size:13.5px;margin:0}
.syncmsg.err{color:var(--bad)}.syncmsg.ok{color:var(--good)}

/* PDF selection */
.selbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--accent-soft);border-radius:8px;padding:10px 12px;margin-bottom:12px}
.selbar .grow{margin-right:auto;font-size:14px}
.selbar b{font-family:var(--f-mono);font-weight:500}
.row input[type=checkbox],.dlg input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);margin:0;flex:none}
.row .code{display:flex;align-items:center;gap:8px}
.row.picked{background:var(--accent-soft)}
.dlg .opts{display:grid;gap:10px}
.dlg .opts label{display:flex;gap:10px;align-items:center;font-size:14px;cursor:pointer}

/* dialog + toast */
.scrim{position:fixed;inset:0;background:rgba(10,15,13,.45);display:grid;place-items:center;z-index:50;padding:16px}
.dlg{background:var(--surface);border-radius:10px;padding:22px;max-width:420px;width:100%;box-shadow:var(--shadow);display:grid;gap:12px}
.dlg h2{margin:0;font-family:var(--f-display);text-transform:uppercase;font-size:22px}
.dlg p{margin:0;color:var(--muted)}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{transform:translate(-50%,8px);opacity:0}}}
</style>
</head>

function lineCost(i){const y=num(i.yield)||100;return num(i.qty)*num(i.price)/(y/100)}

}

function buildCatalog(){
  const m=new Map(),src=new Map(sheets);
  if(current&&view==="editor")src.set(current.id,current.data);
  for(const [sid,s] of src)for(const i of s.ingredients||[]){
    const k=normKey(i.name);if(!k)continue;
    const e=m.get(k)||{key:k,name:i.name.trim(),uses:[],manual:null};
    e.uses.push({sid,code:s.code,sheet:s.name,unit:String(i.unit||"").trim(),qty:i.qty,price:num(i.price),hasPrice:hasVal(i.price)&&num(i.price)>0,yield:i.yield,t:s.updatedAt||0});
    m.set(k,e);
  }
  for(const [id,d] of ingDocs){const k=normKey(d.name);if(!k)continue;const e=m.get(k)||{key:k,name:d.name.trim(),uses:[],manual:null};e.manual={id,...d};m.set(k,e)}
  for(const e of m.values()){
    const priced=e.uses.filter(u=>u.hasPrice).sort((a,b)=>b.t-a.t);
    const count={};priced.forEach(u=>count[u.unit]=(count[u.unit]||0)+1);
    const top=Object.entries(count).sort((a,b)=>b[1]-a[1]||(a[0]===priced[0]?.unit?-1:1))[0]?.[0];
    e.unit=(e.manual&&hasVal(e.manual.unit))?e.manual.unit.trim():(top??e.uses[0]?.unit??"");
    const same=priced.filter(u=>u.unit===e.unit),ps=same.map(u=>u.price);
    e.mixed=priced.some(u=>u.unit!==e.unit);
    e.last=same[0]?.price??null;e.prev=same[1]?.price??null;
    e.avg=ps.length?ps.reduce((a,b)=>a+b,0)/ps.length:null;e.min=ps.length?Math.min(...ps):null;e.max=ps.length?Math.max(...ps):null;
    const man=e.manual&&hasVal(e.manual.price)?num(e.manual.price):null;
    e.est=man??e.last;e.src=man!=null?"manual":(e.last!=null?"auto":"none");
    e.t=Math.max(same[0]?.t||0,e.manual?.updatedAt||0,e.uses[0]?e.uses.reduce((a,u)=>Math.max(a,u.t),0):0);
    e.category=e.manual?.category||"";e.notes=e.manual?.notes||"";
    e.yield=(e.manual&&hasVal(e.manual.yield))?e.manual.yield:(e.uses.filter(u=>hasVal(u.yield)).sort((a,b)=>b.t-a.t)[0]?.yield||"");
    e.sheetCount=new Set(e.uses.map(u=>u.sid)).size;
  }
  return m;
}
function catalog(){
  const m=new Map();
  for(const e of buildCatalog().values())m.set(e.key,{name:e.name,unit:e.unit,price:priceIn(e.est),yield:e.yield});
  return m;
}

function renderStats(){
  const el=document.getElementById("stats");if(!el)return;
  const total=sheets.size;let list,scope;
  const sel=selecting&&selected.size?[...selected].filter(id=>sheets.has(id)):[];
  if(sel.length){list=sel.map(id=>{const s=sheets.get(id);return {id,s,c:calc(s)}});scope=t("stScopeSel",list.length)}
  else{list=lastRows;scope=list.length===total?t("stScopeAll"):t("stScopeFilter",list.length,total)}
  const n=list.length,keys=["rascunho","teste","validada"],cnt={rascunho:0,teste:0,validada:0};

let saveTimer=null,saving=Promise.resolve(),dirty=false;
function setSave(state,msg){const el=document.getElementById("saveState");if(!el)return;el.classList.toggle("err",state==="error");el.textContent=msg||t({pending:"pending",saving:"saving",saved:"saved",waiting:"saveWaiting"}[state])}

function flush(){

const SpeechRec=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,recOn=false;
function dictUi(on,msg){
  const b=document.getElementById("dictBtn"),live=document.getElementById("dictLive");
  if(b){b.setAttribute("aria-pressed",String(on));b.querySelector("span").textContent=on?t("dictStop"):t("dictStart")}
  if(live){live.hidden=!on;if(on)document.getElementById("dictText").innerHTML=msg??`${esc(t("dictListening"))} <i>${esc(t("dictHelp"))}</i>`}
}
function appendStep(raw){
  let text=String(raw||"").replace(/\s+/g," ").trim();if(!text||!current)return;
  const words=L().dictWords.map(normKey);
  const parts=[];let buf=[];
  for(const w of text.split(" ")){buf.push(w);const tail=normKey(buf.join(" "));const hit=words.find(x=>tail.endsWith(x));
    if(hit){const n=hit.split(" ").length;const keep=buf.slice(0,buf.length-n).join(" ").trim();if(keep)parts.push(keep);buf=[]}}
  if(buf.join(" ").trim())parts.push(buf.join(" ").trim());
  const ta=document.getElementById("e-method");if(!ta)return;
  let v=ta.value.replace(/\s+$/,"");
  for(let st of parts){st=st.charAt(0).toLocaleUpperCase(loc())+st.slice(1);if(!/[.!?…:;]$/.test(st))st+=".";v+=(v?"\n":"")+st}
  ta.value=v;ta.dispatchEvent(new Event("input",{bubbles:true}));ta.scrollTop=ta.scrollHeight;
}
function startDictation(){
  if(!window.FT_STANDALONE){toast(t("dictUnavail"));return}
  if(!SpeechRec){toast(t("dictNoBrowser"));return}
  try{
    rec=new SpeechRec();rec.lang=loc();rec.continuous=true;rec.interimResults=true;
    rec.onresult=e=>{let interim="";for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)appendStep(r[0].transcript);else interim+=r[0].transcript}
      const el=document.getElementById("dictText");if(el)el.innerHTML=interim?esc(interim):`${esc(t("dictListening"))} <i>${esc(t("dictHelp"))}</i>`};
    rec.onerror=e=>{if(e.error==="no-speech"||e.error==="aborted")return;
      recOn=false;dictUi(false);toast(e.error==="not-allowed"||e.error==="service-not-allowed"?t("dictDenied"):e.error==="audio-capture"?t("dictNoMic"):t("dictError"))};
    rec.onend=()=>{if(recOn){try{rec.start()}catch(err){recOn=false;dictUi(false)}}else dictUi(false)};
    rec.start();recOn=true;dictUi(true);
  }catch(err){recOn=false;dictUi(false);toast(t("dictError"))}
}
function stopDictation(){if(!rec)return;recOn=false;try{rec.stop()}catch(err){}dictUi(false)}

const safeName=s=>(s||"ficha").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"_").slice(0,60);
function exportXlsx(s){
  if(typeof XLSX==="undefined"){toast(t("xlsxFail"));return}
  const X=L().x,c=calc(s),ings=(s.ingredients||[]).filter(i=>i.name||num(i.qty));
  const useY=ings.some(i=>num(i.yield)&&num(i.yield)!==100);
  const ws={};const put=(a,v)=>{if(v==null||v==="")return;ws[a]=typeof v==="object"?v:(typeof v==="number"?{t:"n",v}:{t:"s",v:String(v)})};
  const N=(v,z)=>({t:"n",v,z:z||"0.00"});
  if(libLine())put("B1",libLine());
  put("B2",X.title);
  put("B3",X.name);put("C3",s.name);put("F3",X.code);put("G3",s.code);
  put("B4",X.fam);put("C4",s.family);put("F4",X.doses);put("G4",num(s.doses)||"");
  put("B5",X.prep);put("C5",s.prepTime);put("F5",X.cook);put("G5",s.cookTime);
  X.heads.forEach((h,k)=>put("BCDEF"[k]+"6",h));
  if(useY)put("G6",X.yield);
  put("H6",X.sum);put("I6",X.val);
  let r=7;
  for(const i of ings){
    put("B"+r,i.name);put("C"+r,i.unit);
    if(!isQb(i.unit)||num(i.qty))put("D"+r,N(num(i.qty),"0.000"));
    put("E"+r,N(num(i.price)));
    if(useY){put("G"+r,N(num(i.yield)||100,"0"));ws["F"+r]={t:"n",v:lineCost(i),f:`IF(G${r}>0,D${r}*E${r}/(G${r}/100),D${r}*E${r})`,z:"0.00"}}
    else ws["F"+r]={t:"n",v:lineCost(i),f:`D${r}*E${r}`,z:"0.00"};
    r++;
  }
  const last=Math.max(r-1,7);
  const vals=[{t:"n",v:c.total,f:`SUM(F7:F${last})`,z:"0.00"},{t:"n",v:c.doses,f:"G4"},{t:"n",v:c.perDose,f:"IF(I8>0,I7/I8,0)",z:"0.00"},
    {t:"n",v:c.fc/100,z:"0%"},{t:"n",v:c.rec,f:"IF(I10>0,I9/I10,0)",z:"0.00"},c.sale?N(c.sale):"",
    c.sale?{t:"n",v:c.margin,f:"I12-I9",z:"0.00"}:"",c.sale?{t:"n",v:c.fcReal,f:"IF(I12>0,I9/I12,0)",z:"0.0%"}:""];
  X.rows.forEach((l,k)=>{put("H"+(7+k),l);put("I"+(7+k),vals[k])});
  let y=Math.max(r,7+X.rows.length)+1;
  const block=(title,text)=>{put("B"+y,title);y++;for(const line of String(text||"").split(/\n/)){if(line.trim()){put("B"+y,line.trim());y++}}y++};
  block(X.method,(s.method||"").split(/\n+/).filter(x=>x.trim()).map((x,k)=>`${k+1}. ${x.trim()}`).join("\n"));
  if((s.prepPhotos||[]).length)block(t("secPrep"),s.prepPhotos.map((ph,i)=>`${i+1}. ${ph.title||t("photoN",i+1)}`).join("\n"));
  block(X.notes,s.notes);
  block(X.all,(s.allergens||[]).map(allergenLabel).join(", ")||X.allNone);
  if(s.conservation)block(X.cons,s.conservation);
  block(X.origin,[srcLabel(s.source),s.sourceNote,X.status+": "+stLabel(s.status)].filter(Boolean).join(" — "));
  ws["!ref"]=`A1:I${y}`;
  ws["!cols"]=[{wch:3},{wch:34},{wch:14},{wch:12},{wch:16},{wch:14},{wch:10},{wch:20},{wch:12}];
  ws["!merges"]=[{s:{r:1,c:1},e:{r:1,c:6}}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,X.sheet);
  save(`${safeName(s.code)}_${safeName(s.name)}.xlsx`,XLSX.write(wb,{bookType:"xlsx",type:"array"}));
}

      const head=()=>{doc.setFillColor(...SOFT);doc.rect(M,y,CW,7,"F");F(7,"bold",MUT);let x=M;cols.forEach(([h,w,a])=>{doc.text(pdfTxt(h.toUpperCase()),a==="right"?x+w-2:x+2,y+4.7,{align:a});x+=w});y+=7};
      ensure(18);head();
      const ings=(s.ingredients||[]).filter(i=>i.name||num(i.qty));
      if(!ings.length){F(9.5,"normal",MUT);doc.text(pdfTxt(t("noIng")),M+2,y+5);y+=8}
      for(const i of ings){
        F(9.5);const nm=i.name+(num(i.yield)&&num(i.yield)!==100?` (${t("aprov")} ${i.yield} %)`:"");
        const nl=doc.splitTextToSize(pdfTxt(nm),cols[0][1]-4);const rh=nl.length*3.9+3.4;
        if(y+rh>BOT){newPage();head()}
        const noPrice=String(i.price??"").trim()==="";
        const vals=[nl,pdfTxt(i.unit),isQb(i.unit)&&!num(i.qty)?"":pdfTxt(fq(num(i.qty))),noPrice?"":pdfTxt(eur(num(i.price))),noPrice?"":pdfTxt(eur(lineCost(i)))];
        let x=M;F(9.5,"normal",INK);cols.forEach(([,w,a],k)=>{doc.text(vals[k],a==="right"?x+w-2:x+2,y+4.6,{align:a});x+=w});
        y+=rh;doc.setDrawColor(...LINE);doc.setLineWidth(.2);doc.line(M,y,M+CW,y);
      }
      if(opts.costs){
        ensure(8);F(9.5,"bold",INK);doc.text(pdfTxt(t("totalCost")),M+CW-33,y+5,{align:"right"});doc.text(pdfTxt(eur(c.total)),M+CW-2,y+5,{align:"right"});y+=10;
        const pairs=[[t("sTotal"),eur(c.total)],[t("sDoses"),String(c.doses||"—")],[t("sDose"),eur(c.perDose)],[t("sRec"),c.rec?eur(c.rec):"—"],
          [t("sSale"),c.sale?eur(c.sale):"—"],[t("sMargin"),c.margin==null?"—":eur(c.margin)],[t("sFcReal"),c.fcReal==null?"—":pct(c.fcReal)],[t("sFc"),c.fc+" %"]];
        const bh=7+4*6.4+2;ensure(bh+2);
        doc.setFillColor(...INK);doc.rect(M,y,CW,7,"F");F(8.5,"bold",[255,255,255]);doc.text(pdfTxt(t("sumTitle").toUpperCase()),M+3,y+4.8);
        doc.setDrawColor(...LINE);doc.setLineWidth(.2);doc.rect(M,y,CW,bh);const half=CW/2;doc.line(M+half,y+7,M+half,y+bh);
        pairs.forEach(([l,v],k)=>{const x=M+(k<4?0:half),yy=y+7+(k%4)*6.4+4.6,big=k===2||k===4;
          F(9,big?"bold":"normal",big?INK:MUT);doc.text(pdfTxt(l),x+3,yy);F(9.5,big?"bold":"normal",INK);doc.text(pdfTxt(v),x+half-3,yy,{align:"right"})});
        y+=bh+2;
      }
      heading(t("secMethod"));
      const steps=(s.method||"").split(/\n+/).map(x=>x.trim()).filter(Boolean);
      if(steps.length)steps.forEach((st,k)=>{para(st,10,INK,7,(k+1)+".");y+=1});else para(t("toFill"),10,MUT);
      if(prep&&prep.length){
        heading(t("secPrep"));
        const gap=5,cols=3,bw=(CW-gap*(cols-1))/cols,bh=bw*0.75;
        for(let i=0;i<prep.length;i+=cols){
          const row=prep.slice(i,i+cols);
          F(8);const caps=row.map((im,k)=>doc.splitTextToSize(pdfTxt(im.title?`${im.n||i+k+1}. ${im.title}`:String(im.n||i+k+1)),bw).slice(0,2));
          const rowH=bh+3+Math.max(...caps.map(c=>c.length))*3.4;
          ensure(rowH+2);
          row.forEach((im,k)=>{const x=M+k*(bw+gap);
            let w=bw,h=bw*im.h/im.w;if(h>bh){h=bh;w=bh*im.w/im.h}
            doc.setFillColor(...SOFT);doc.rect(x,y-2.5,bw,bh,"F");
            doc.addImage(im.data,"JPEG",x+(bw-w)/2,y-2.5+(bh-h)/2,w,h);
            F(8,"normal",INK);doc.text(caps[k],x,y-2.5+bh+3.6)});
          y+=rowH+2;
        }
      }
      heading(t("secNotes"));
      para(s.notes||t("toFill"),10,s.notes?INK:MUT);
      heading(t("secAll"));
      const al=(s.allergens||[]).map(allergenLabel);
      if(al.length){F(10,"bold",RED);doc.splitTextToSize(pdfTxt(al.join("  ·  ")),CW).forEach(l=>{ensure(lh(10));doc.text(l,M,y);y+=lh(10)})}else para(t("noAll"),10,MUT);
      if(s.conservation){heading(t("secCons"));para(s.conservation)}
    };
    const starts=[];
    items.forEach(({id,s},k)=>{if(multi||k>0)newPage();else y=M+2;starts.push(doc.getNumberOfPages());drawSheet(s,photos.get(id),prepImgs.get(id))});
    if(multi){
      doc.setPage(1);
      doc.setFillColor(...ACC);doc.rect(0,0,W,6,"F");
      F(30,"bold",INK);doc.text(pdfTxt(t("pdfDocTitle").toUpperCase()),M,42);
      F(11,"normal",MUT);doc.text(pdfTxt(t("pdfCoverSub",items.length,new Date().toLocaleDateString(loc(),{dateStyle:"long"}))),M,51);
      {let yy0=26;const own=String(libInfo.owner||"").trim();const fs=libFields();
       if(own||fs.length){F(10,"normal",MUT);const parts=[];if(own)parts.push(t("owner")+": "+own);fs.forEach(f=>parts.push((f.label?f.label+": ":"")+f.value));
         doc.splitTextToSize(pdfTxt(parts.join("   ·   ")),CW).slice(0,2).forEach((l,i)=>doc.text(l,M,yy0-4+i*4.6))}}
      doc.setDrawColor(...INK);doc.setLineWidth(.7);doc.line(M,58,M+CW,58);
      F(12,"bold",INK);doc.text(pdfTxt(t("pdfIndex").toUpperCase()),M,70);
      let p=1,yy=79;
      const hdr=()=>{F(7,"bold",MUT);doc.text(pdfTxt(t("colNo").toUpperCase()),M,yy);doc.text(pdfTxt(t("colDish").toUpperCase()),M+24,yy);doc.text(pdfTxt(t("colFam").toUpperCase()),M+120,yy);doc.text(pdfTxt(t("pdfPageCol").toUpperCase()),M+CW,yy,{align:"right"});yy+=5.5};
      hdr();
      items.forEach(({s},k)=>{
        if(k===FIRST+(p-1)*PER){p++;doc.setPage(p);yy=M+6;hdr()}
        F(9,"normal",MUT);doc.text(pdfTxt(s.code),M,yy);
        F(9.5,"normal",INK);doc.text(doc.splitTextToSize(pdfTxt(s.name||t("noName")),92)[0],M+24,yy);
        F(9,"normal",MUT);doc.text(doc.splitTextToSize(pdfTxt(s.family||"—"),40)[0],M+120,yy);
        F(9.5,"bold",INK);doc.text(String(starts[k]),M+CW,yy,{align:"right"});
        doc.setDrawColor(...LINE);doc.setLineWidth(.15);doc.line(M,yy+2,M+CW,yy+2);
        yy+=5.6;
      });
    }
    const n=doc.getNumberOfPages();
    for(let i=1;i<=n;i++){doc.setPage(i);F(7.5,"normal",MUT);doc.setDrawColor(...LINE);doc.setLineWidth(.2);doc.line(M,H-12,M+CW,H-12);doc.text(doc.splitTextToSize(pdfTxt([t("pdfDocTitle"),libLine()].filter(Boolean).join("  ·  ")),CW-40)[0],M,H-8);doc.text(pdfTxt(t("pdfPage",i,n)),M+CW,H-8,{align:"right"})}
  }catch(e){console.error(e);toast(t("pdfFail"));return}
  const one=items.length===1?items[0].s:null;
  await save(one?`${safeName(one.code)}_${safeName(one.name)}.pdf`:`${L().x.file}_${today()}.pdf`,doc.output("arraybuffer"));
}

const pop=document.getElementById("morePop"),moreBtn=document.getElementById("moreBtn");
moreBtn.onclick=e=>{e.stopPropagation();pop.hidden=!pop.hidden;moreBtn.setAttribute("aria-expanded",String(!pop.hidden))};
document.addEventListener("click",e=>{if(!pop.hidden&&!pop.contains(e.target)){pop.hidden=true;moreBtn.setAttribute("aria-expanded","false")}});
pop.addEventListener("click",e=>{const a=e.target.closest("[data-act]")?.dataset.act;if(!a)return;pop.hidden=true;
  if(a==="pdfAll")pdfFor([...sheets.keys()]);if(a==="ingCsv")exportIngCsv();if(a==="csv")exportCsv();if(a==="json")exportJson();if(a==="import")document.getElementById("importFile").click()});
document.getElementById("importFile").addEventListener("change",e=>{const f=e.target.files[0];e.target.value="";if(f)importJson(f)});
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.lang)));
document.getElementById("goHome").onclick=()=>view==="editor"?leave(renderLibrary):renderLibrary();
document.querySelectorAll("[data-nav]").forEach(b=>b.addEventListener("click",()=>{const go=b.dataset.nav==="ingredients"?renderIngredients:renderLibrary;view==="editor"?leave(go):go()}));
document.getElementById("newBtn").onclick=()=>view==="editor"?leave(newSheet):newSheet();
document.addEventListener("visibilitychange",()=>{if(document.hidden)flush()});
app.addEventListener("input",onEdInput);

/* ---------- shared library (GitHub) ---------- */
function syncLabel(st){return {ok:t("syncOk"),busy:t("syncBusy"),pending:t("syncPending"),ro:t("syncRO"),error:t("syncErr"),offline:t("syncOffline"),local:t("syncLocal")}[st.status]||""}
function renderSyncChip(){
  const c=document.getElementById("syncChip");if(!c||!window.FT_SYNC)return;
  const st=FT_SYNC.state();c.hidden=false;c.dataset.st=st.status;c.querySelector("span").textContent=syncLabel(st);
  c.title=st.lastSync?t("syncLast",new Date(st.lastSync).toLocaleString(loc())):t("syncNever");
}
function syncDialog(){
  if(!window.FT_SYNC)return;
  const [owner,repo]=FT_SYNC.repo.split("/");const st=FT_SYNC.state();
  const d=document.createElement("div");d.className="scrim";
  d.innerHTML=`<div class="dlg" role="dialog" aria-modal="true" style="max-width:540px"><h2>${esc(t("syncTitle"))}</h2>
    <p>${esc(t("syncIntro","\u0001","\u0002")).replace("\u0001",`<code>${esc(FT_SYNC.path)}</code>`).replace("\u0002",`<code>${esc(FT_SYNC.repo)}</code>`)}</p>
    <p class="hint" style="margin:0">${esc(t("syncPublic"))}</p>
    <p class="syncmsg">${esc(syncLabel(st))} · ${esc(st.lastSync?t("syncLast",new Date(st.lastSync).toLocaleString(loc())):t("syncNever"))}</p>
    ${st.error==="auth"?`<p class="syncmsg err">${esc(t("syncAuthErr"))}</p>`:""}
    ${FT_SYNC.hasToken()?`<p class="syncmsg ok">${esc(t("tokenConnected"))}</p>
      <div class="acts"><button class="btn danger" type="button" id="tkOff">${esc(t("tokenRemove"))}</button><button class="btn" type="button" id="syNow">${esc(t("syncNow"))}</button><button class="btn primary" type="button" data-close>${esc(t("closeBtn"))}</button></div>`
    :`<label class="f">${esc(t("tokenLabel"))}<input id="tkIn" type="password" autocomplete="off" spellcheck="false" placeholder="${esc(t("tokenPh"))}"></label>
      <p class="hint" style="margin:0">${esc(t("tokenHelp",owner,repo))}</p><p class="syncmsg" id="tkMsg"></p>
      <div class="acts"><button class="btn" type="button" data-close>${esc(t("cancel"))}</button><button class="btn primary" type="button" id="tkSave">${esc(t("tokenSave"))}</button></div>`}
  </div>`;
  const close=()=>d.remove();
  d.addEventListener("click",async e=>{
    if(e.target===d||e.target.closest("[data-close]")){close();return}
    if(e.target.closest("#syNow")){FT_SYNC.syncNow();close();return}
    if(e.target.closest("#tkOff")){FT_SYNC.clearToken();return}
    if(e.target.closest("#tkSave")){
      const tk=d.querySelector("#tkIn").value.trim(),msg=d.querySelector("#tkMsg");if(!tk){d.querySelector("#tkIn").focus();return}
      msg.className="syncmsg";msg.textContent=t("tokenChecking");
      try{const r=await FT_SYNC.testToken(tk);
        if(r.ok){FT_SYNC.setToken(tk);return}
        msg.className="syncmsg err";msg.textContent=r.status===200?t("tokenBad"):t("tokenFail",r.status);
      }catch(err){msg.className="syncmsg err";msg.textContent=t("tokenFail","—")}
    }
  });
  layer.appendChild(d);(d.querySelector("#tkIn")||d.querySelector("[data-close]")).focus();
}
if(window.FT_SYNC){FT_SYNC.on(renderSyncChip);document.getElementById("syncChip").addEventListener("click",syncDialog)}
app.addEventListener("change",onEdChange);

renderChrome();
renderLibrary();

(async()=>{
  const c=window.claude;if(!c?.use){dbState="none";renderLibrary();return}
  const [d,u,a,dl]=await Promise.all([c.use("db"),c.use("user"),c.use("assets"),c.use("downloads")]);
  db=d;assets=a;downloads=dl;
  if(u){try{const w=await u.can("data.write");if(w===false)canWrite=false}catch{}}
  if(!db){dbState="none";canWrite=false;if(view==="library")renderLibrary();return}
  db.collection("sheets").onSnapshot(snap=>{
    const m=new Map(snap.docs.map(x=>[x.id,x.data()]));
    if(current&&dirty&&view==="editor")m.set(current.id,current.data);
    sheets=m;dbState="ready";
    if(view==="library")renderList();
    else if(view==="ingredients")renderIngList();
    else if(view==="editor")refreshIngList();
    else if(view==="preview"&&current&&sheets.has(current.id)){const fresh=sheets.get(current.id);if(fresh!==current.src){current.src=fresh;current.data=JSON.parse(JSON.stringify(fresh));renderPreview()}}
  },()=>{dbState="none";toast(t("lost"))});
  db.collection("ingredients").onSnapshot(snap=>{
    ingDocs=new Map(snap.docs.map(x=>[x.id,x.data()]));
    if(view==="ingredients")renderIngList();else if(view==="editor")refreshIngList();
  },()=>{});
  db.collection("settings").onSnapshot(snap=>{
    const doc=snap.docs.find(x=>x.id==="library");const v=doc?doc.data():null;
    libInfo=v?{owner:v.owner||"",fields:Array.isArray(v.fields)?v.fields.map(f=>({label:f.label||"",value:f.value||""})):[]}:{owner:"",fields:[]};
    renderLibMeta();
  },()=>{});
  if(view==="library")renderLibrary();
})();
